        :root {
            --bg-dark: #04060d;
            --primary-blue: #007bff;
            --accent-gold: #ffd700;
            --text-light: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.75);
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top, #0b1a30 0%, #04060d 100%);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* --- EFEK KILATAN & GARIS PETIR BERCABANG --- */
        .storm-lightning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 170vh;
            background: transparent;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: lightningFlash 5s infinite;
        }

        @keyframes lightningFlash {
            0%, 80%, 84%, 90%, 96%, 100% {
                opacity: 0;
                background-color: transparent;
            }
            81%, 91% {
                opacity: 1;
                background-color: rgba(210, 235, 255, 0.35);
                box-shadow: inset 0 0 120px rgba(100, 180, 255, 0.5);
            }
            82%, 92% {
                opacity: 0.1;
                background-color: rgba(0, 50, 100, 0.15);
            }
            83%, 95% {
                opacity: 0.7;
                background-color: rgba(255, 255, 255, 0.25);
            }
        }

        /* Garis Sambaran Petir Bercabang SVG */
        .lightning-bolt {
            position: fixed;
            top: 0;
            left: 10%;
            width: 40vw;
            height: 80vh;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            filter: drop-shadow(0 0 15px rgba(150, 210, 255, 0.9));
            animation: boltStrike 5s infinite;
        }

        .lightning-bolt.right {
            left: auto;
            right: 5%;
            width: 35vw;
            transform: scaleX(-1);
            animation-delay: 1.8s;
        }

        @keyframes boltStrike {
            0%, 80%, 83%, 90%, 95%, 100% {
                opacity: 0;
            }
            81%, 91% {
                opacity: 1;
            }
            82%, 92% {
                opacity: 0.2;
            }
        }

        /* --- EFEK HUJAN BADAI FULL LAYAR (170vw) --- */
        .storm-rain-front {
            position: fixed;
            top: 0;
            left: -20vw;
            width: 230vw;
            height: 100vh;
            z-index: 20;
            pointer-events: none;
            overflow: hidden;
        }

        .storm-drop {
            position: absolute;
            background: linear-gradient(transparent, rgba(200, 230, 255, 0.85));
            transform: rotate(-30deg);
            animation: stormFall linear infinite;
        }

        @keyframes stormFall {
            0% {
                transform: translate(0, -200px) rotate(-30deg);
            }
            100% {
                transform: translate(-170vw, 120vh) rotate(-30deg);
            }
        }

        /* Sebaran Titik Hujan Merata Menyeluruh */

        }
